name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - name: Coverage summary
        run: |
          awk -F, 'NR>1{m+=$8;c+=$9} END{printf "### Cobertura de líneas: %.1f%%\n", 100*c/(m+c)}' \
            target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY

  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B spotless:check

  build:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          IMAGE=${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: elearning
          image: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
          execution-role-arn: ${{ vars.EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.INFRASTRUCTURE_ROLE_ARN }}
          container-port: 8080
          health-check-path: /actuator/health/liveness
          cpu: '512'
          memory: '1024'
          min-task-count: 1
          max-task-count: 1
          secrets: |
            [
              {"name": "JWT_SECRET", "valueFrom": "${{ vars.JWT_SECRET_ARN }}"},
              {"name": "ADMIN_PASSWORD", "valueFrom": "${{ vars.ADMIN_PASSWORD_ARN }}"}
            ]