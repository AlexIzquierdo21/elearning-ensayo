name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - name: Coverage summary
        run: |
          awk -F, 'NR>1{m+=$8;c+=$9} END{printf "### Cobertura de líneas: %.1f%%\n", 100*c/(m+c)}' \
            target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY

  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B spotless:check